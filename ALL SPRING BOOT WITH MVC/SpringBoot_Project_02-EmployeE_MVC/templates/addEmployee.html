<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Employee</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#667eea,#764ba2,#6dd5ed,#2193b0);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
    overflow:hidden;
}

/* Animated Background */
@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating Circles */
body::before,
body::after{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    animation:float 8s ease-in-out infinite;
}

body::before{
    top:-80px;
    left:-80px;
}

body::after{
    bottom:-80px;
    right:-80px;
    animation-delay:4s;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(25px);}
}

/* Glass Card */

.container{
    width:450px;
    padding:35px;
    border-radius:20px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 45px rgba(0,0,0,.25);
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h2{
    text-align:center;
    color:#fff;
    margin-bottom:25px;
    font-size:30px;
    text-shadow:2px 2px 10px rgba(0,0,0,.3);
}

label{
    color:white;
    font-weight:bold;
    display:block;
    margin-top:12px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
    background:rgba(255,255,255,.85);
    transition:.3s;
}

input:focus{
    transform:scale(1.03);
    box-shadow:0 0 12px rgba(255,255,255,.7);
}

/* Save Button */

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:50px;
    background:#28a745;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.4s;
}

button:hover{
    transform:translateY(-3px);
    background:#1f8b38;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

/* Links */

.links{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
}

.links a{
    text-decoration:none;
    color:white;
    font-weight:bold;
    transition:.3s;
}

.links a:hover{
    color:#ffe082;
    transform:scale(1.05);
}

</style>

</head>

<body>

<div class="container">

    <h2>👨‍💼 Add Employee</h2>

    <form th:action="@{/employee/save}"
          th:object="${employee}"
          method="post">

        <label>Employee Name</label>
        <input type="text"
               th:field="*{name}"
               placeholder="Enter Employee Name"
               required>

        <label>Department</label>
        <input type="text"
               th:field="*{department}"
               placeholder="Enter Department"
               required>

        <label>Email</label>
        <input type="email"
               th:field="*{email}"
               placeholder="Enter Email Address"
               required>

        <label>Mobile Number</label>
        <input type="number"
               th:field="*{mob_num}"
               placeholder="Enter Mobile Number"
               required>

        <button type="submit">
            💾 Save Employee
        </button>

    </form>

    <div class="links">
        <a th:href="@{/employee/all}">📋 View Employees</a>
        <a th:href="@{/}">🏠 Home</a>
    </div>

</div>

</body>
</html>
